<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice Recorder Pro</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="icon"
      href="icon/3700401-microphone-radio-recording-sound-technology-vintage-voice_108796.png">

<style>

</style>

</head>
<body>

<div class="container">

    <h2>🎙 Voice Recorder Pro</h2>

    <div class="file-input-wrapper">
      <input
          type="text"
          id="fileName"
          class="file-input"
          placeholder="Masukkan nama file MP3">
  </div>

    <button id="startBtn">
        ▶ Start Recording
    </button>

    <button id="stopBtn" disabled>
        ■ Stop Recording
    </button>

    <p id="status">
        Siap merekam...
    </p>
    <h3 class="section-title">
      📋 Daftar Recording
      </h3>
      
      <div id="list"></div>

</div>

<script>
if (!navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia) {

    document.getElementById("status").textContent =
        "❌ Browser/WebView tidak mendukung perekaman audio";
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/ffmpeg.min.js"></script>
<script src="app.js"></script>

</body>
</html>
