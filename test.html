<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice Recorder Pro</title>

<link rel="stylesheet" href="style.css">

<link rel="icon"
      href="icon/3700401-microphone-radio-recording-sound-technology-vintage-voice_108796.png">

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

button{
    padding:12px 20px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#startBtn{
    background:#28a745;
    color:white;
}

#stopBtn{
    background:#dc3545;
    color:white;
}

#status{
    margin-top:15px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

audio{
    width:100%;
}
</style>

</head>
<body>

<div class="container">

    <h2>🎙 Voice Recorder Pro</h2>

    <button id="startBtn">
        ▶ Start Recording
    </button>

    <button id="stopBtn" disabled>
        ■ Stop Recording
    </button>

    <p id="status">
        Siap merekam...
    </p>

    <h3>📋 Daftar Recording</h3>

    <table>

        <thead>
            <tr>
                <th>Nama File</th>
                <th>Audio</th>
                <th>Download</th>
            </tr>
        </thead>

        <tbody id="list"></tbody>

    </table>

</div>

<script>
if (!navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia) {

    document.getElementById("status").textContent =
        "❌ Browser/WebView tidak mendukung perekaman audio";
}
</script>

<script src="app.js"></script>

</body>
</html>
